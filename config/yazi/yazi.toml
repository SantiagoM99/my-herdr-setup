# Con qué abre yazi cada archivo. Enter usa la primera opción; O (mayúscula) deja elegir entre todas.
# block = true: el programa toma la terminal y al salir (q) se vuelve a yazi.

[opener]
pdf = [
  { run = "tdf %s1", desc = "tdf (en la terminal)", block = true },
  { run = "open %s", desc = "Preview" },
]
tabla = [
  # Un hilo de Arrow: pyarrow segfaultea con algunos parquets del ETL.
  { run = "OMP_NUM_THREADS=1 ARROW_NUM_THREADS=1 vd %s1", desc = "visidata", block = true },
  { run = "open %s", desc = "App por defecto" },
]
markdown = [
  { run = "glow -p %s1", desc = "glow (leer)", block = true },
  { run = "code %s", desc = "VS Code (editar)" },
]
log = [
  { run = "tail -n 200 -F %s1", desc = "Seguir en vivo (Ctrl+C sale)", block = true },
  { run = "code %s", desc = "VS Code" },
]

[open]
prepend_rules = [
  { url = "*.pdf", use = [ "pdf", "reveal" ] },
  { url = "*.{csv,tsv,parquet,xlsx,json,jsonl}", use = [ "tabla", "edit", "reveal" ] },
  { url = "*.{md,markdown}", use = [ "markdown", "reveal" ] },
  { url = "*.log", use = [ "log", "edit", "reveal" ] },
]
