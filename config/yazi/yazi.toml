# What yazi opens each file with. Enter uses the first option; O (capital) lets you choose.
# block = true: the program takes over the terminal and quitting it (q) returns to yazi.

[opener]
pdf = [
  { run = "tdf %s1", desc = "tdf (in the terminal)", block = true },
  { run = "open %s", desc = "Preview" },
]
table = [
  # Single Arrow thread: pyarrow segfaults on some of the observatory ETL parquets.
  { run = "OMP_NUM_THREADS=1 ARROW_NUM_THREADS=1 vd %s1", desc = "visidata", block = true },
  { run = "open %s", desc = "Default app" },
]
markdown = [
  { run = "herdr-md -t %s1", desc = "glow (read; e edits with micro)", block = true },
  { run = "code %s", desc = "VS Code (edit)" },
]
log = [
  { run = "tail -n 200 -F %s1", desc = "Follow live (Ctrl+C exits)", block = true },
  { run = "code %s", desc = "VS Code" },
]

[open]
prepend_rules = [
  { url = "*.pdf", use = [ "pdf", "reveal" ] },
  { url = "*.{csv,tsv,parquet,xlsx,json,jsonl}", use = [ "table", "edit", "reveal" ] },
  { url = "*.{md,markdown}", use = [ "markdown", "reveal" ] },
  { url = "*.log", use = [ "log", "edit", "reveal" ] },
]
