# Enter hands every file to herdr-open, which picks the program by type (see bin/herdr-open).
# O (capital) offers the alternatives: $EDITOR, the default macOS app, or Finder.

[opener]
herdr = [
  { run = "herdr-open %s1", desc = "By type (herdr-open)", block = true },
]

[open]
prepend_rules = [
  { url = "*", use = [ "herdr", "edit", "open", "reveal" ] },
]
