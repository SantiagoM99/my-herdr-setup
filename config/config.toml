onboarding = false
[ui]
tab_bar_right = [{ type = "command", command = "~/.local/bin/job-status", interval_seconds = 10, timeout_seconds = 5 }]

[keys]
prefix = "`"
# Rename tab moves from shift+t to comma (as in tmux) to leave t/shift+t to tables.
rename_tab = "prefix+comma"

# Viewer shortcuts. The letter says what opens; Shift says where:
#   prefix+<letter>        pane on the right (half the width), closes with q
#   prefix+shift+<letter>  floating popup, closes with q
#   f = files (yazi)   m = markdown (glow; e edits with micro)   a = PDF (picker + tdf)   i = VS Code
#   t = CSV/parquet tables (visidata)
#   u = latest log, live (popup: pick one)   y = SQL (harlequin: DuckDB over parquet/CSV, Postgres)
#   shift+j = git (lazygit)   shift+k = Docker (lazydocker); both popup only
# d is avoided: prefix+shift+d closes the workspace.

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/.local/bin/herdr-side yazi"

[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "~/.local/bin/herdr-md"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "~/.local/bin/herdr-side ~/.local/bin/herdr-md"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "~/.local/bin/herdr-pdf"
width = "90%"
height = "95%"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/.local/bin/herdr-side ~/.local/bin/herdr-pdf"

# Opens the current pane's directory in VS Code; the temporary pane closes by itself.
[[keys.command]]
key = "prefix+i"
type = "pane"
command = "code ."

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.local/bin/herdr-side ~/.local/bin/herdr-data"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "~/.local/bin/herdr-data"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "~/.local/bin/herdr-side ~/.local/bin/herdr-log"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "~/.local/bin/herdr-log --pick"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "~/.local/bin/herdr-side harlequin"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "harlequin"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "lazydocker"
width = "95%"
height = "95%"
