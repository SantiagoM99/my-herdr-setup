onboarding = false
[ui]
tab_bar_right = [{ type = "command", command = "~/.local/bin/etl-estado", interval_seconds = 10, timeout_seconds = 5 }]

[keys]
prefix = "`"
# Renombrar pestaña pasa de shift+t a coma (como en tmux) para dejar t/shift+t a las tablas.
rename_tab = "prefix+comma"

# Atajos de visor. La letra dice qué se abre; Shift dice dónde:
#   prefix+<letra>        panel fijo a la derecha (mitad del ancho), se cierra con q
#   prefix+shift+<letra>  popup flotante, se cierra con q
#   f = archivos (yazi)   m = markdown (glow; e edita con micro)   a = PDF (selector + tdf)   i = VS Code
#   t = tablas CSV/parquet (visidata)
#   u = último log en vivo (popup: elegir cuál)   y = SQL (harlequin: DuckDB sobre parquet/CSV, Postgres)
#   shift+j = git (lazygit)   shift+k = Docker (lazydocker); los dos solo popup
# Se evita d: prefix+shift+d cierra el workspace.

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/.local/bin/herdr-lado yazi"

[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "~/.local/bin/herdr-md"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "~/.local/bin/herdr-lado ~/.local/bin/herdr-md"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "~/.local/bin/herdr-pdf"
width = "90%"
height = "95%"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "~/.local/bin/herdr-lado ~/.local/bin/herdr-pdf"

# Abre la carpeta del panel actual en VS Code; el panel temporal se cierra solo.
[[keys.command]]
key = "prefix+i"
type = "pane"
command = "code ."

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.local/bin/herdr-lado ~/.local/bin/herdr-datos"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "~/.local/bin/herdr-datos"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+u"
type = "shell"
command = "~/.local/bin/herdr-lado ~/.local/bin/herdr-log"

[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = "~/.local/bin/herdr-log --elegir"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "~/.local/bin/herdr-lado harlequin"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "harlequin"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+j"
type = "popup"
command = "lazygit"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "lazydocker"
width = "95%"
height = "95%"
