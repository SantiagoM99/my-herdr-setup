onboarding = false
[ui]
tab_bar_right = [{ type = "command", command = "~/.local/bin/herdr-dictate --status", interval_seconds = 1, timeout_seconds = 1 }, { type = "command", command = "~/.local/bin/job-status", interval_seconds = 1, timeout_seconds = 5 }]

[theme]
name = "tokyo-night"

[keys]
prefix = "`"

# Shortcuts. The letter says what opens; Shift says where:
#   prefix+<letter>        pane on the right (half the width)
#   prefix+shift+<letter>  floating popup
#   f = files (yazi)   i = VS Code
#   a = find any file by name or contents and open it by type
#   m = dictate: start recording, press again to type the transcription (no Shift form)
# Both close when the program exits. d is avoided: prefix+shift+d closes the workspace.

[[keys.command]]
key = "prefix+shift+f"
description = "files (yazi), popup"
type = "popup"
command = "yazi"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+f"
description = "files (yazi), pane"
type = "shell"
command = "~/.local/bin/herdr-side yazi"

[[keys.command]]
key = "prefix+shift+a"
description = "find a file and open it, popup"
type = "popup"
command = "~/.local/bin/herdr-find"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+a"
description = "find a file and open it, pane"
type = "shell"
command = "~/.local/bin/herdr-side ~/.local/bin/herdr-find"

[[keys.command]]
key = "prefix+m"
description = "dictate: start, or stop and type the text"
type = "shell"
command = "~/.local/bin/herdr-dictate"

# Opens the current pane's directory in VS Code; the temporary pane closes by itself.
[[keys.command]]
key = "prefix+i"
description = "VS Code in this directory"
type = "pane"
command = "code ."
